  D: 1-q
  u: D/s
  z: s/2
  B_exits: [q,1,z]
  B_occupation: [1/s-epsilon/2,1/s-epsilon/2,epsilon]
  B_entrance: [1/s-q*epsilon/s,q/s-q*epsilon/s,2*q*epsilon/s]
  new_edge_flux_coefficients: [M/2,s*M/4,q*M/2+u,s*M/4+D/2]
  old_edge_fluxes: [mu_x-epsilon*M/4,q*mu_y-epsilon*(q*M/2+u)/2]
  exact_constraint: (S^2+2sS+cI)*1=0 and alpha*t=2q/s
  explicit_parameter_choice: See all_q_architecture_advantage.md equations8and10.
