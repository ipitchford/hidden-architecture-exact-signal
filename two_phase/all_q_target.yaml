target_id: strict_architecture_advantage_all_q
date: 2026-10-26
contribution: explicit_constructive_theorem
statement: >
  For each real 0<q<1, V4(Pq)<V3(Pq)=(1-q)log(1/q), where Vn is the
  infimum over at most n total states of finite irreducible CTMC exact
  stationary deterministic-observation realisations of the alternating
  renewal law with A~Exp(1+q), B transform (2qz/(1+q)+1+q+q^2)/
  (z^2+2(1+q)z+1+q+q^2). Every off-diagonal rate of the constructed
  four-state generator is positive and finite; rates are rational for rationalq.
exclusions:
  - No all-architecture optimum or nonattainment conclusion.
  - No four-state optimality conclusion.
  - No claim that every finite architecture can be improved.
  - No historical-priority certification.
normalisation: Same as target.yaml; ordinary reversal, row generator, natural logs.
