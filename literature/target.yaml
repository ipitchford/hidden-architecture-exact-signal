    ((q^2-R^2)*(q-K^2))) >= 3*log(1/q)
    for abs(R)<q, abs(K)<sqrt(q).
  initial_density_bound: "4*r*sqrt(1-m*f0)*atanh(sqrt(1-m*f0))"
  affinity_lemma: "J(p,q)>=4*sqrt(1-affinity^2)*atanh(sqrt(1-affinity^2))"
  insertion_derivative: "u^2/(1+u)*(3-log(1-u^2)/2-3*atanh(u)/u), u=(1-q)/(1+q)"
