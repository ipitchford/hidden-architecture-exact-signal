    - "(8*z+21)/(12*z^2+36*z+21)"
  killed_polynomial: "z^2+2*(1+q)*z+1+q+q^2"
  ring_characteristic: "z*(z^2+3*(1+q)*z+3*(1+q+q^2))"
  ring_matrix: "[[-1-q,1,q],[q,-1-q,1],[1,q,-1-q]]"
  witness_matrix: "[[-21/20,4781/4800,31/1200,9/320],[1/20,-79/60,19/15,0],[4/5,1/3,-131/60,21/20],[21/20,0,1/5,-5/4]]"
  witness_pi: "[1/3,217/720,7/36,41/240]"
