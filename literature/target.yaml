target_id: hidden_architecture_advantage_and_immediate_return_cost
date: 2026-10-26
contribution_units:
  - id: C1
    type: theorem_and_proof
    statement: >-
      For every 0<q<1, the minimum stationary EPR among all irreducible
      three-state deterministic-binary-labelled CTMC exact realisations of
      P_q equals (1-q)*log(1/q), achieved uniquely up to B-state relabelling
      by the homogeneous biased three-cycle.
    decision: CLEAR_TO_PROVE_WITHIN_RECORDED_CORPUS
  - id: C2
    type: exact_counterexample_and_verification
    statement: >-
      For every 0<q<1, a constructive finite four-state generator with all
      off-diagonal rates positive realises exactly the complete stationary
      law P_q and has EPR below every three-state realisation. Its rates are
      rational for rational q. Minimum feasible Markov cardinality is not
      sufficient for thermodynamic optimality.
    decision: CLEAR_TO_PROVE_WITHIN_RECORDED_CORPUS
  - id: C3
    type: sharp_optimisation_and_nonattainment
    statement: >-
      For every r,m,f0>0 with 0<r*m<1, the EPR infimum over all finite
      irreducible stationary CTMCs with a nontrivial deterministic binary
      partition and B entrance statistics (r,m,f0) is
      4*r*sqrt(1-m*f0)*atanh(sqrt(1-m*f0)) when m*f0<1, and zero otherwise.
      The positive infimum is unattained but approached with three states;
      the zero infimum is attained reversibly with at most three states.
    decision: CLEAR_TO_PROVE_WITHIN_RECORDED_CORPUS
definitions:
  P_q: "A~Exp(1+q); B Laplace=(2*q*z/(1+q)+1+q+q^2)/(z^2+2*(1+q)*z+1+q+q^2)"
  generator: row
  stationary_distribution: row
  entropy: "sum_{i<j}(pi_i*Q_ij-pi_j*Q_ji)*log(pi_i*Q_ij/(pi_j*Q_ji))"
  reversal: ordinary_even_variables
  logarithm: natural
  k_B: 1
  dwell_sampling: stationary_entrance_sampling_of_complete_visits
  Jeffreys: "D(p||q)+D(q||p)"
  affinity: "sum_i sqrt(p_i*q_i)"
